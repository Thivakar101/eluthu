name: Bug report
description: Report an issue with capture, review, export, or the interface
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a sample or synthetic project when possible. Do not attach private handwriting.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: extras
    attributes:
      label: Screenshots or error messages
